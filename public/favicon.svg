<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180507" />
      <stop offset="50%" stop-color="#0F0F0F" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E3B" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#8B0006" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#E50914" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#softGlow)"/>

  <!-- CineStream 'C' + Film Reel + Play Symbol -->
  <g filter="url(#shadow)">
    <!-- Cinema Arc Outer Frame -->
    <path d="M 330 145 C 220 135 145 190 145 256 C 145 322 220 377 330 367 C 348 365 358 348 350 334 C 343 322 328 316 312 318 C 235 326 195 292 195 256 C 195 220 235 186 312 194 C 328 196 343 190 350 178 C 358 164 348 147 330 145 Z" fill="url(#redGrad)"/>
    
    <!-- Central Play Triangle in Golden-White High Contrast -->
    <path d="M 235 200 L 325 256 L 235 312 Z" fill="#FFFFFF"/>
  </g>

  <!-- Film Perforations Decor on top/bottom subtle -->
  <rect x="180" y="80" width="22" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="220" y="80" width="22" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="260" y="80" width="22" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="300" y="80" width="22" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>

  <rect x="180" y="418" width="22" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="220" y="418" width="22" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="260" y="418" width="22" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="300" y="418" width="22" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>
</svg>
